# rustfmt configuration for metaText.
# Only stable options are used so `cargo fmt` works on the stable toolchain.
edition = "2021"
max_width = 100
hard_tabs = false
tab_spaces = 4
newline_style = "Unix"
use_small_heuristics = "Default"
reorder_imports = true
reorder_modules = true
merge_derives = true
remove_nested_parens = true
