name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        # Warnings are errors here: the crates enable `clippy::pedantic`,
        # `clippy::nursery` and the panic-family lints (`unwrap_used`,
        # `expect_used`, `panic`, `unreachable`, `todo`, `unimplemented`), so this
        # step is the gate that keeps them from accumulating. Unit tests are exempt
        # through a `cfg(test)` allow, because a test may assert by unwrapping.
        run: cargo clippy --all-targets --all-features --workspace -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (default features)
        run: cargo build --workspace --verbose
      - name: Test (default features)
        run: cargo test --workspace --verbose
      - name: Test (all features)
        run: cargo test --workspace --all-features --verbose

  tui-e2e:
    name: terminal suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Drive the full screen interface on a pty
        # The crate tests cover the pieces that are pure functions; this suite
        # covers what only a terminal can show - the alternate screen, the pane
        # layout, the line editor, every command, and two peers exchanging frames
        # while the interface draws what arrives. It builds the binary with
        # `terminal-ui` itself, because `cargo test` relinks it without the feature
        # and `--mode tui` then falls back to the line oriented REPL.
        run: make tui-e2e

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features --workspace
