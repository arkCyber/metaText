name: Bug report
description: Report a reproducible problem with metaText
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please fill in as much detail
        as you can. For security issues, do **not** use this form — see
        [SECURITY.md](https://github.com/arksong/meta-text-rust/blob/main/SECURITY.md).
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I searched existing issues and this has not been reported yet.
          required: true
        - label: I am running the latest release or the `main` branch.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact commands, flags and inputs.
      placeholder: |
        1. cargo run -- --mode cli --nick Alice
        2. Type `/connect 127.0.0.1:34568`
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: metaText version
      description: Output of `meta-text --version` or `/version`.
      placeholder: "0.4.0"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode in use
      options:
        - cli
        - tui
        - server
        - daemon
    validations:
      required: true
  - type: input
    id: rust-version
    attributes:
      label: Rust version
      description: Output of `rustc --version`.
      placeholder: "rustc 1.93.1 (01f6ddf75 2026-02-11)"
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15.0 / Ubuntu 24.04 / Windows 11"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Run with `-D` / `--log-level debug` and paste the output.
      render: shell
    validations:
      required: false
